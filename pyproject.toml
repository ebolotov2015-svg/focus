[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clarity-cli"
version = "0.1.0"
description = "A local-first CLI for focus sessions, simple music, and productivity stats."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "clarity-cli contributors" }
]
keywords = ["focus", "timer", "productivity", "cli", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Utilities",
]
dependencies = [
  "platformdirs>=4.2",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
audio = [
  "pygame>=2.5",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
focus = "clarity_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
